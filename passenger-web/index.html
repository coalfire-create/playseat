<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101013" media="(prefers-color-scheme: dark)">
<title>플레이시트</title>
<style>
/* ============================================================
   동승자 웹앱

   차량 화면(Pleos 시스템 UI 를 따르는 헤어라인 표)과 달리, 폰은 손에 들고
   엄지로 쓰는 화면입니다. 그래서 금융 앱처럼 읽히게 짰습니다 —
     - 옅은 회색 바탕 위에 흰 카드. 선으로 나누지 않고 면으로 나눕니다
     - 카드마다 [굵은 제목 → 내용]. 글자는 크고 진하게, 보조 글자는 회색
     - 색은 파랑 하나. '지금 누를 수 있는 것' 과 '지금 활성' 에만 씁니다
     - 버튼·입력은 테두리 없이 면으로. 누르면 살짝 눌립니다
   차량과 이어지는 것은 좌석 배치·문구·분위기 색입니다.
   ============================================================ */
  :root{
    --bg:#f2f4f6; --cell:#ffffff; --cell2:#f2f4f6; --glass:#f9fafb;
    --line:#d1d6db; --fg:#191f28; --fg2:#4e5968; --sub:#8b95a1;
    --accent:#3182f6; --accent-soft:#e8f3ff; --accent-ink:#1b64da;
    --inv:#191f28; --oninv:#ffffff;
    --shadow:0 1px 2px rgba(0,23,51,.04),0 6px 18px rgba(0,23,51,.05);
  }
  /* 차량이 차량 설정의 주간·야간을 따르듯, 폰은 폰의 설정을 따릅니다. */
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#101013; --cell:#1c1c21; --cell2:#2a2a31; --glass:#17171b;
      --line:#3a3a43; --fg:#f2f4f6; --fg2:#c3c8cf; --sub:#8b95a1;
      --accent:#3182f6; --accent-soft:rgba(49,130,246,.2); --accent-ink:#7ab4ff;
      --inv:#f2f4f6; --oninv:#191f28;
      --shadow:none;
    }
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* display 를 가진 요소에는 hidden 속성이 먹지 않습니다. */
  [hidden]{display:none!important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg); min-height:100vh;
    font:15px/1.5 "Toss Product Sans","Pretendard",-apple-system,BlinkMacSystemFont,
         "Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    letter-spacing:-.01em;
    padding-bottom:calc(env(safe-area-inset-bottom) + 84px);
    -webkit-font-smoothing:antialiased;
    transition:background-color .8s ease;
  }
  .wrap{max-width:460px;margin:0 auto}
  /* 선으로 나누지 않습니다. 구역은 카드가 만듭니다. */
  .hr{display:none}
  .sec{margin:12px 16px 0;padding:22px 20px;background:var(--cell);
       border-radius:24px;box-shadow:var(--shadow)}
  .lbl{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;
       letter-spacing:-.02em;margin-bottom:14px}
  .lbl .n{color:var(--sub);font-weight:500;font-size:13.5px}
  .lbl .r{margin-left:auto;font-size:12.5px;color:var(--sub);font-weight:500}

  /* ---------- 머리말 ---------- */
  header{display:flex;align-items:center;gap:12px;height:58px;padding:0 20px;
         position:sticky;top:0;z-index:20;background:var(--bg);
         transition:background-color .8s ease}
  header .brand{font-size:20px;font-weight:800;letter-spacing:-.03em}
  header .st{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--fg2);
             background:var(--cell);padding:6px 12px;border-radius:999px;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:66%}

  /* ---------- 분위기 ----------
     이름만 띄우면 틀렸을 때 그냥 멍청한 기능입니다. 근거를 같이 보여 주면
     사람이 "아 그래서" 하고 넘어가거나 직접 고칩니다. */
  .mood{display:flex;align-items:center;gap:12px;margin:4px 16px 0;padding:14px 18px;
        border-radius:20px;transition:background-color .8s ease}
  .mood .dot{width:12px;height:12px;border-radius:50%;flex:none;
             transition:background-color .8s ease}
  .mood .tx{min-width:0}
  .mood b{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.02em}
  .mood span{display:block;font-size:13px;color:var(--fg2);
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ---------- 알림 카드 ---------- */
  .note{margin:12px 16px 0;background:var(--cell);padding:16px 20px;border-radius:20px;
        box-shadow:var(--shadow)}
  .note b{display:block;font-size:15px;font-weight:700;margin-bottom:3px;letter-spacing:-.02em}
  .note span{font-size:13px;color:var(--fg2)}
  .note.on{background:var(--accent-soft);box-shadow:none}
  .note.on b{color:var(--accent-ink)}

  /* ---------- 좌석 ---------- */
  .carbox{position:relative;width:100%;max-width:330px;margin:0 auto;aspect-ratio:.63}
  .carbox svg.body{position:absolute;inset:0;width:100%;height:100%}
  .seat{position:absolute;display:flex;flex-direction:column;border:0;padding:0;
        background:none;font:inherit;color:inherit;cursor:default;border-radius:0}
  .seat:active{background:none;transform:none}
  .seat .head{align-self:center;width:44%;height:7%;background:var(--line);
              border-radius:5px 5px 0 0}
  .seat .face{flex:1;display:flex;flex-direction:column;align-items:center;
              justify-content:center;gap:3px;border:1.5px dashed var(--line);
              border-radius:14px 14px 8px 8px;background:transparent;position:relative;
              transition:background-color .2s,transform .12s}
  .seat .nm{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:-.02em}
  .seat .st{font-size:11px;font-weight:500;color:var(--sub);max-width:92%;
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 앉아 있는 좌석은 흰 면으로 띄우고 빈 좌석은 점선 자리만 남깁니다. */
  .seat.on .face{background:var(--cell);border:1.5px solid transparent;
                 box-shadow:0 1px 3px rgba(0,23,51,.08)}
  .seat.on .head{background:var(--sub);opacity:.5}
  .seat.on .nm{color:var(--fg)}
  /* 지금 나오는 곡을 고른 자리. */
  .seat.picker .face{background:var(--accent-soft);border-color:transparent;box-shadow:none}
  .seat.picker .head{background:var(--accent);opacity:1}
  .seat.picker .nm,.seat.picker .st{color:var(--accent-ink)}
  .seat.me .face{border:2px solid var(--accent)}
  .seat.pick{cursor:pointer}
  .seat.pick .face{border:2px solid var(--accent);background:var(--cell)}
  .seat.pick .st{color:var(--accent);font-weight:700}
  .seat.pick:active .face{transform:scale(.96);background:var(--accent-soft)}

  /* 메인 화면의 축약 좌석. 차 그림을 다시 그리면 화면을 다 먹습니다. */
  .cabin{background:var(--cell2);border-radius:18px;padding:8px}
  .cabin .r{display:flex;gap:8px}
  .cabin .r+.r{margin-top:8px}
  .cabin .seat{position:static;flex:1;min-width:0;height:66px}
  .cabin .seat .head{display:none}
  .cabin .seat .face{border-radius:13px}

  /* ---------- 지금 재생 ---------- */
  .np{display:flex;align-items:center;gap:16px}
  .art{width:72px;height:72px;flex:none;background:var(--cell2);object-fit:cover;
       border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--sub)}
  .np .meta{min-width:0;flex:1}
  .np .ti{font-size:22px;font-weight:800;letter-spacing:-.03em;line-height:1.25;
          max-height:2.5em;overflow:hidden}
  .np .ar{font-size:14px;color:var(--fg2);margin-top:3px;
          white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .np .by{font-size:12.5px;color:var(--sub);margin-top:5px}
  .np .idle{font-size:16px;font-weight:600;color:var(--sub)}
  .iconbtn{width:44px;height:44px;flex:none;border:0;background:var(--cell2);color:var(--fg2);
           border-radius:50%;padding:0;
           display:flex;align-items:center;justify-content:center;cursor:pointer}
  .iconbtn svg{width:20px;height:20px}
  .bar{height:6px;background:var(--cell2);margin-top:20px;border-radius:999px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:999px;
         transition:width .9s linear}
  .times{display:flex;margin-top:9px;font-size:12.5px;color:var(--sub);font-weight:500}
  /* 전체 음원이 아니라는 사실을 숨기지 않습니다. 작게, 그러나 분명히 적습니다. */
  .badge{display:inline-block;margin-left:7px;padding:2px 8px;border-radius:999px;
         background:var(--accent-soft);color:var(--accent-ink);font-size:11px;font-weight:700;
         vertical-align:middle}

  /* 도착 맞춤 편성 — 큐와 남은 시간을 같은 자에 올려 놓습니다. */
  .plan{margin:2px 0 14px;padding:16px;background:var(--cell2);border-radius:18px}
  .plan .track{position:relative;height:18px;background:var(--cell);border-radius:6px;
               display:flex}
  .plan .seg{height:100%;border-right:2px solid var(--cell2);box-sizing:border-box}
  .plan .seg:first-child{border-radius:6px 0 0 6px}
  .plan .seg.now{background:var(--accent)}
  .plan .seg.q{background:var(--line)}
  /* 도착선이 걸쳐 버리는 곡. 잘리는 부분이라 사선으로 긋습니다. */
  .plan .seg.cut{background:repeating-linear-gradient(135deg,
                 #f04452 0 3px, transparent 3px 6px);opacity:.8}
  .plan .mark{position:absolute;top:-5px;bottom:-5px;width:3px;border-radius:2px;background:var(--fg)}
  .plan .foot2{display:flex;align-items:center;gap:10px;margin-top:12px;
               font-size:12.5px;color:var(--sub);flex-wrap:wrap}
  .plan .foot2 b{color:var(--fg);font-weight:700;font-size:13.5px;flex:1 1 100%}
  .plan .foot2 button{margin-left:auto}

  /* 좌석 지분 — 막지 않고 보여 주기만 합니다. */
  .share{margin-top:16px}
  .share .track{height:10px;border-radius:999px;overflow:hidden;display:flex;background:var(--cell2)}
  .share .seg{height:100%;background:var(--accent);transition:width .5s ease}
  .share .keys{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;
               font-size:12.5px;color:var(--fg2);font-weight:500}
  .share .keys i{display:inline-block;width:8px;height:8px;border-radius:50%;
                 background:var(--accent);margin-right:6px;vertical-align:middle}
  .share .note2{margin-top:9px;font-size:12.5px;color:var(--sub)}
  .times span:last-child{margin-left:auto}

  /* ---------- 버튼 ----------
     테두리 없이 면으로. 누르면 살짝 눌립니다. */
  button{font:inherit;color:var(--fg2);background:var(--cell2);border:0;
         border-radius:14px;padding:13px 16px;font-weight:700;cursor:pointer;
         letter-spacing:-.01em;transition:transform .12s ease,opacity .12s ease}
  button:active{transform:scale(.97);opacity:.85}
  button:disabled{color:var(--sub);opacity:.55;cursor:not-allowed;transform:none}
  button.primary{background:var(--accent);color:#fff}
  button.primary:disabled{background:var(--cell2);color:var(--sub);opacity:1}
  button.sm{padding:10px 15px;font-size:14px;border-radius:12px}
  .acts{display:flex;gap:8px;margin-top:18px}
  .acts button{flex:1;padding:13px 15px;border-radius:14px}
  /* 차가 권한 곡을 받는 쪽만 파랗게. 거절은 같은 크기의 회색입니다. */
  #bTakeNow{background:var(--accent-soft);color:var(--accent-ink)}

  /* ---------- 입력 ---------- */
  .srow{display:flex;gap:8px}
  input{flex:1;min-width:0;font:inherit;font-weight:500;color:var(--fg);background:var(--cell2);
        border:2px solid transparent;border-radius:14px;padding:12px 14px;
        transition:border-color .15s,background-color .15s}
  input::placeholder{color:var(--sub)}
  input:focus{outline:none;border-color:var(--accent);background:var(--cell)}

  /* ---------- 목록 ---------- */
  ul{list-style:none;margin:6px -6px 0;padding:0}
  li{display:flex;gap:12px;align-items:center;padding:9px 6px;border-radius:14px}
  li .no{width:16px;flex:none;font-size:13px;font-weight:700;color:var(--sub);text-align:center}
  li .art{width:48px;height:48px;border-radius:12px}
  li .art svg{width:22px;height:22px}
  li .meta{flex:1;min-width:0}
  li .ti{font-size:15px;font-weight:600;letter-spacing:-.02em;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  li .ar{font-size:12.5px;color:var(--sub);margin-top:1px;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  li .dur{font-size:12.5px;font-weight:500;color:var(--sub);flex:none}
  #results li{animation:up .28s cubic-bezier(.2,.8,.2,1) both}
  #results li:nth-child(2){animation-delay:.03s}
  #results li:nth-child(3){animation-delay:.06s}
  #results li:nth-child(4){animation-delay:.09s}
  #results li:nth-child(n+5){animation-delay:.12s}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .empty{flex:1;padding:14px 0 4px;font-size:13.5px;color:var(--sub);text-align:center}
  .foot{padding:22px 20px calc(env(safe-area-inset-bottom) + 18px);
        font-size:12px;color:var(--sub);text-align:center}
  .gatehint{margin:14px 16px 0;padding:14px 20px;font-size:13.5px;font-weight:600;
            color:var(--accent-ink);background:var(--accent-soft);border-radius:16px;
            text-align:center}
  h1{font-size:25px;font-weight:800;letter-spacing:-.03em;margin:0 0 8px;line-height:1.35}
  .p{font-size:14.5px;color:var(--fg2);margin:0}

  /* ---------- 토스트 ---------- */
  #toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);
         max-width:428px;margin:0 auto;background:var(--inv);color:var(--oninv);
         padding:15px 18px;border-radius:16px;font-size:14px;font-weight:600;
         z-index:50;opacity:0;transform:translateY(14px);pointer-events:none;
         box-shadow:0 8px 24px rgba(0,23,51,.18);
         transition:opacity .22s ease,transform .22s cubic-bezier(.2,.8,.2,1)}
  #toast.on{opacity:1;transform:none}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">플레이시트</div>
    <div class="st" id="hStatus">연결 중</div>
  </header>
  <div class="hr"></div>
  <div id="moodSlot"></div>

  <!-- 최초 진입: 좌석 선택 -->
  <section id="gate">
    <div class="sec">
      <h1>어디에 앉으셨어요?</h1>
      <p class="p">좌석을 고르면 바로 선곡에 참여합니다.<br>다음부터는 타기만 하면 자동으로 연결됩니다.</p>
    </div>
    <div class="hr"></div>
    <div class="sec">
      <div class="carbox" id="carbox"></div>
    </div>
    <div class="hr"></div>
    <div class="sec">
      <div class="lbl">표시할 이름</div>
      <input id="nick" placeholder="예: 지호" autocomplete="off" maxlength="12">
    </div>
    <div class="hr"></div>
    <div class="gatehint" id="gateHint">차량이 연결되면 좌석이 표시됩니다</div>
  </section>

  <!-- 메인 -->
  <main id="main" hidden>
    <div id="stripSlot"></div>

    <section class="sec">
      <div class="lbl">좌석 <span class="n" id="seatNote"></span></div>
      <div class="cabin">
        <div class="r" id="cRow1"></div>
        <div class="r" id="cRow2"></div>
      </div>
      <div id="shareSlot"></div>
    </section>
    <div class="hr"></div>

    <div id="suggSlot"></div>

    <section class="sec">
      <div class="lbl">지금 재생</div>
      <div class="np">
        <div class="art" id="npArt"></div>
        <div class="meta">
          <div class="idle" id="npIdle">재생 중인 곡이 없습니다</div>
          <div class="ti" id="npTitle" hidden></div>
          <div class="ar" id="npArtist" hidden></div>
          <div class="by" id="npBy" hidden></div>
        </div>
        <button class="iconbtn" id="bSkipIcon" title="건너뛰기"></button>
      </div>
      <div class="bar" id="npBarBox"><i id="npBar"></i></div>
      <div class="times" id="npTimes"><span id="npTime"></span><span id="npSkip"></span></div>
      <div class="acts">
        <button class="sm" id="bLike">좋아요</button>
        <button class="sm" id="bSkip">건너뛰기</button>
      </div>
    </section>
    <div class="hr"></div>

    <section class="sec">
      <div class="lbl">곡 추가 <span class="r" id="srcNote"></span></div>
      <div class="srow">
        <input id="q" placeholder="곡명 또는 가수" autocomplete="off" enterkeyhint="search">
        <button class="primary" id="bSearch">검색</button>
      </div>
      <ul id="results"></ul>
    </section>
    <div class="hr"></div>

    <section class="sec">
      <div class="lbl">대기 중인 곡 <span class="n" id="qCount">0</span>
        <span class="r" id="qLen"></span></div>
      <div id="planSlot"></div>
      <ul id="queue"></ul>
    </section>
    <div class="hr"></div>

    <section class="sec" id="album" hidden></section>

    <div class="foot" id="foot"></div>
  </main>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   원칙 두 가지 — 어기면 차량 판정과 화면이 어긋납니다.
   1. 스스로 판단하지 않습니다. 화면은 state.sync 를 그대로 그립니다.
      턴 순서·스킵 과반을 폰에서 계산하지 않습니다.
   2. 낙관적 업데이트 금지. 요청을 보내고 다음 state.sync 를 기다립니다.
      차량이 거절할 수 있으므로 먼저 반영하면 되돌려야 합니다.
   ============================================================ */

/**
 * 무드 색. 차량 앱 Mood.kt 와 같은 값입니다.
 *
 * 한곳에서 내려받지 않고 양쪽에 같은 표를 두는 이유는, 색이 없다고 화면이
 * 멈추면 안 되기 때문입니다. 모르는 무드가 오면 회색으로 그립니다.
 */
const MOOD_COLOR = {
  RAIN:"#4C6E8F", NIGHT:"#3B4B7A", SUNNY:"#E0A33C",
  WINDING:"#2F8F6B", LOUNGE:"#7A5CA8", ARRIVING:"#BF6B4A", CALM:"#6E7B86",
};

/* 차량 CarScreen.kt 의 좌석 이름·배치와 같은 값입니다. */
const SEAT = {
  R1L:{ name:"운전석", row:1, driver:true, x:.135, y:.255, w:.29,  h:.215 },
  R1R:{ name:"조수석", row:1,              x:.575, y:.255, w:.29,  h:.215 },
  R2L:{ name:"2열 좌", row:2,              x:.115, y:.555, w:.245, h:.215 },
  R2C:{ name:"2열 중", row:2,              x:.3775,y:.555, w:.245, h:.215 },
  R2R:{ name:"2열 우", row:2,              x:.64,  y:.555, w:.245, h:.215 },
};
const AUTO_SEAT = "AUTO";
const label = (id) => id === AUTO_SEAT ? "분위기 추천" : ((SEAT[id] && SEAT[id].name) || id);
const $ = (id) => document.getElementById(id);

/* 녹화용 확대. 헤드리스 브라우저의 화면 스트림은 1배율로만 나오므로,
   화면을 두 배 크기로 열고 페이지를 그만큼 키워 선명하게 받습니다.
   `?zoom=2` 가 붙었을 때만 동작하고, 평소 폰에서는 아무 일도 하지 않습니다. */
{
  const z = Number(new URLSearchParams(location.search).get("zoom"));
  if (z > 1 && z <= 3) document.documentElement.style.zoom = String(z);
}

const sessionId = new URLSearchParams(location.search).get("s") || "a3f9";
let deviceId = localStorage.getItem("playseat.deviceId");
if (!deviceId) {
  deviceId = "dev_" + Math.random().toString(36).slice(2, 8);
  localStorage.setItem("playseat.deviceId", deviceId);
}
let nickname = localStorage.getItem("playseat.nickname") || "";

/**
 * 탑승 코드.
 *
 * 차량 화면의 QR 안에만 들어 있는 네 자리입니다. QR 만으로 좌석을 열어 두면
 * 주차장에서 찍어 둔 사진 한 장으로 남의 차 플레이리스트에 들어올 수 있습니다.
 * 코드는 차 안 화면에만 있으므로 "그 차에 지금 타고 있다" 를 증명합니다.
 * 계정도 비밀번호도 만들지 않고 그걸 증명하는 방법입니다.
 *
 * 한 번 받으면 저장해 둡니다. 차량이 다시 켜지면 코드가 바뀌므로 그때는
 * 거절이 돌아오고, 그 자리에서 QR 을 다시 찍으라고 안내합니다.
 */
const urlCode = new URLSearchParams(location.search).get("c");
if (urlCode) localStorage.setItem("playseat.joinCode", urlCode);
let joinCode = localStorage.getItem("playseat.joinCode") || "";

/** 좌석별 지분 색. 좌석 순서를 고정해 같은 자리가 늘 같은 농도로 보이게 합니다. */
const SHARE_ALPHA = { R1L:1, R1R:.72, R2L:.5, R2C:.34, R2R:.22, AUTO:.14 };

let ws = null, state = null, mySeat = null, results = [], carOnline = false;
/* 머리말에 띄울 연결 상태. 끊긴 동안에는 주행 상태로 덮지 않습니다. */
let link = "연결 중";

/* ---------- 유틸 ---------- */
const mmss = (ms) => {
  const s = Math.max(0, Math.round((ms || 0) / 1000));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
};
const mins = (ms) => Math.round((ms || 0) / 60000);
/**
 * 실제로 재생되는 길이.
 *
 * durationMs 는 곡의 원래 길이이고, 미리듣기 음원은 그보다 짧게 끝납니다.
 * 진행 바와 도착 계산은 '흐를 시간' 으로 해야 맞습니다.
 */
const playMs = (t) => (t && (t.playableMs || t.durationMs)) || 0;
/** 분·초를 사람이 읽는 문장 조각으로. "1분 40초" / "40초" */
const human = (ms) => {
  const s = Math.max(0, Math.round(Math.abs(ms || 0) / 1000));
  const m = Math.floor(s / 60);
  return m ? (s % 60 ? `${m}분 ${s % 60}초` : `${m}분`) : `${s}초`;
};
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.className = "on";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (t.className = ""), 2600);
}
const send = (o) => ws && ws.readyState === 1 && ws.send(JSON.stringify({ ts: Date.now(), ...o }));

function node(markup) {
  const d = document.createElement("div");
  d.innerHTML = markup.trim();
  return d.firstElementChild;
}
/** 차량 Icons.kt 와 같은 선 아이콘. 24 기준 2px, 끝은 둥글게. */
const ICON = {
  note: `<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
         <path d="M9 18V5l9 2v8"/><circle cx="6.4" cy="18" r="2.6"/><circle cx="15.4" cy="15" r="2.6"/></svg>`,
  next: `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
         <path d="M6 5l9 7-9 7z"/><path d="M18 5v14"/></svg>`,
};

/**
 * 앨범 커버.
 *
 * 주소가 있으면 그걸 쓰고, 없으면 차량과 같은 평면 타일 + 음표 아이콘을 둡니다.
 * 예전에는 곡명으로 색을 만든 그라데이션 타일을 썼는데, 헤드유닛 화면 옆에
 * 두면 폰만 다른 앱처럼 보였습니다. 구분은 색이 아니라 제목이 합니다.
 */
function artEl(url, seedText) {
  if (url) {
    const i = document.createElement("img");
    i.className = "art"; i.src = url; i.alt = ""; i.loading = "lazy";
    i.onerror = () => i.replaceWith(artEl(null, seedText));   // 실패하면 조용히 타일로
    return i;
  }
  const d = document.createElement("div");
  d.className = "art";
  d.append(node(ICON.note));
  return d;
}

/* ---------- 분위기 배경 ----------
   차량은 바탕에 무드 색을 아주 옅게 섞습니다(주간 5.5%, 야간 12%).
   같은 값을 폰에도 씁니다. 세 곳(차량 화면·폰·실내 조명)이 같이 바뀌어야
   "분위기가 바뀌었다"로 읽히고, 한 곳만 바뀌면 고장으로 보입니다. */
const darkMode = () => matchMedia("(prefers-color-scheme: dark)").matches;
function applyTint(hex) {
  const root = document.documentElement;
  if (!hex) { root.style.removeProperty("--bg"); return; }
  const base = darkMode() ? [0x10, 0x10, 0x13] : [0xf2, 0xf4, 0xf6];
  const t = darkMode() ? 0.16 : 0.11;
  const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
  const m = base.map((v, i) => Math.round(v + (c[i] - v) * t));
  root.style.setProperty("--bg", `rgb(${m.join(",")})`);
}

/** 머리말 오른쪽. 차량 Header 와 같은 문구를 씁니다. */
function status() {
  if (link) { $("hStatus").textContent = link; return; }
  if (!state) { $("hStatus").textContent = "연결됨"; return; }
  const driving = state.driveState === "DRIVING";
  $("hStatus").textContent = [
    driving ? "주행 중" : "정차 중",
    state.mode === "CHARGING_LOUNGE" ? "충전 라운지" : null,
    driving && state.etaSeconds != null ? `도착까지 ${Math.floor(state.etaSeconds / 60)}분` : null,
  ].filter(Boolean).join(" · ");
}

/* ---------- 연결 ---------- */
function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const host = location.host || "localhost:8080";
  const sock = new WebSocket(`${proto}//${host}/session/${sessionId}?role=phone&deviceId=${deviceId}`);
  ws = sock;

  sock.onopen = () => { link = null; status(); };

  sock.onclose = () => {
    // 이미 다른 소켓으로 갈아탄 뒤 들어온 close 는 무시합니다.
    //
    // 같은 deviceId 로 새로 접속하면 허브가 **먼저 붙어 있던** 연결을 끊습니다
    // (한 기기는 한 자리). 그 close 를 보고 또 재접속하면, 새 접속이 다시
    // 직전 연결을 끊는 핑퐁이 되어 2초마다 끊겼다 붙습니다. 탭을 두 개 열거나
    // 새로고침만 해도 걸립니다.
    if (ws !== sock) return;
    link = "재연결 중"; carOnline = false; status();
    setTimeout(connect, 2000);
  };

  sock.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }

    if (m.type === "state.sync") { carOnline = true; link = null; state = m; render(); }
    else if (m.type === "car.online") { carOnline = true; link = null; status(); }
    else if (m.type === "car.offline") {
      carOnline = false;
      link = "차량 꺼짐"; status();
      $("gateHint").textContent = "차량 앱이 실행되면 좌석이 표시됩니다";
    }
    else if (m.type === "search.result") { results = m.items || []; renderResults(m); }
    else if (m.type === "drive.album") { renderAlbum(m); }
    else if (m.type === "reject" && (!m.seatId || m.seatId === mySeat)) {
      toast({
        PROFILE_BLOCKED:"이 좌석에서는 추가할 수 없습니다",
        SEAT_TAKEN:"이미 사용 중인 좌석입니다",
        DUPLICATE_VOTE:"이미 투표했습니다",
        DRIVING_RESTRICTED:"주행 중에는 제한됩니다",
        BAD_JOIN_CODE:"차량 화면의 QR 을 다시 찍어주세요",
        NO_FIT:"순서를 바꿔도 도착에 맞출 수 없습니다",
      }[m.reason] || m.reason);
      // 코드가 틀렸다면 들고 있던 값이 낡은 것입니다. 지워서 다시 찍게 합니다.
      if (m.reason === "BAD_JOIN_CODE") {
        joinCode = ""; localStorage.removeItem("playseat.joinCode");
      }
    }
  };
}

/* ---------- 좌석 ---------- */

/**
 * 위에서 내려다본 차체. 차량 CarTopView.kt 와 같은 윤곽입니다.
 *
 * 좌석을 표로 늘어놓는 것보다 "어느 자리인가" 가 형태로 바로 읽히고,
 * 헤드유닛에서 본 그림을 폰에서 다시 보면 같은 기능이라는 것이 설명 없이 전해집니다.
 * 앞이 위쪽입니다. 선 굵기는 화면 크기와 무관하게 고정합니다(non-scaling-stroke).
 */
const PROFILE = [
  [0, .255], [.035, .345], [.095, .410], [.200, .448], [.480, .462],
  [.760, .455], [.890, .420], [.962, .345], [1, .255],
];
function carSvg() {
  const w = 1000, h = Math.round(w / 0.63), cx = w / 2;
  const X = (r) => cx + r * w, Y = (f) => f * h;

  let d = `M ${X(PROFILE[0][1])} 0`;
  for (let i = 0; i < PROFILE.length - 1; i++) {
    const [y0, r0] = PROFILE[i], [y1, r1] = PROFILE[i + 1], mid = (y1 - y0) / 2;
    d += ` C ${X(r0)} ${Y(y0 + mid)}, ${X(r1)} ${Y(y1 - mid)}, ${X(r1)} ${Y(y1)}`;
  }
  d += ` L ${X(-PROFILE[PROFILE.length - 1][1])} ${h}`;
  for (let i = PROFILE.length - 1; i > 0; i--) {
    const [y0, r0] = PROFILE[i], [y1, r1] = PROFILE[i - 1], mid = (y0 - y1) / 2;
    d += ` C ${X(-r0)} ${Y(y0 - mid)}, ${X(-r1)} ${Y(y1 + mid)}, ${X(-r1)} ${Y(y1)}`;
  }
  d += " Z";

  // 바퀴. 차체 밑으로 살짝 드러나는 정도만. 윤곽만 있으면 보트로도 읽힙니다.
  const tw = .028 * w, th = .085 * h;
  const tires = [.150, .740].flatMap((ty) => [-1, 1].map((sg) =>
    `<rect x="${X(sg * .424) - tw / 2}" y="${Y(ty)}" width="${tw}" height="${th}"
           rx="${tw * .45}" fill="var(--line)" opacity=".32"/>`)).join("");

  const line = (x1, y1, x2, y2) =>
    `<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}"/>`;

  return `
  <svg class="body" viewBox="-6 -6 ${w + 12} ${h + 12}" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
    ${tires}
    <path d="${d}" fill="none" stroke="var(--line)" stroke-width="1.6"
          stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <!-- 실내. 좌석이 놓이는 자리입니다. -->
    <rect x="${X(-.395)}" y="${Y(.245)}" width="${.79 * w}" height="${.57 * h}" rx="37"
          fill="var(--glass)" stroke="var(--line)" stroke-opacity=".55" stroke-width="1"
          vector-effect="non-scaling-stroke"/>
    <g stroke="var(--line)" stroke-opacity=".55" stroke-width="1" stroke-linecap="round"
       vector-effect="non-scaling-stroke">
      ${line(-.30, .145, .30, .145)}
      ${line(-.30, .165, -.395, .245)}${line(.30, .165, .395, .245)}
      ${line(-.395, .815, -.305, .885)}${line(.395, .815, .305, .885)}
      ${line(-.305, .885, .305, .885)}
    </g>
    <!-- 사이드미러. 차체가 폭을 꽉 쓰므로 선에 절반쯤 걸쳐 그려야 잘리지 않습니다. -->
    <rect x="${X(-.490)}" y="${Y(.252)}" width="${.065 * w}" height="${.034 * h}"
          rx="${.030 * w}" fill="var(--line)" opacity=".55"/>
    <rect x="${X(.425)}" y="${Y(.252)}" width="${.065 * w}" height="${.034 * h}"
          rx="${.030 * w}" fill="var(--line)" opacity=".55"/>
    <!-- 1열 사이 센터 콘솔. 테두리만 그리면 빈 좌석이 하나 더 있는 것처럼 읽힙니다. -->
    <rect x="${X(-.040)}" y="${Y(.335)}" width="${.080 * w}" height="${.115 * h}"
          rx="${.018 * w}" fill="var(--line)" opacity=".16"/>
  </svg>`;
}

function claim(seatId) {
  const typed = $("nick").value.trim();
  if (typed) { nickname = typed; localStorage.setItem("playseat.nickname", nickname); }
  if (!nickname) { $("nick").focus(); toast("표시할 이름을 먼저 적어주세요"); return; }
  send({ type:"seat.claim", deviceId, seatId, nickname, joinCode });
}

/**
 * 좌석 하나. 차량 SeatSpot 과 같은 구성입니다 —
 * 헤드레스트 + 이름 + 사람 + 선곡 순서 번호. 좌석 안에 숫자를 더 넣지 않습니다.
 */
function seatNode(seatId, opts) {
  const s = (state && (state.seats || []).find((x) => x.seatId === seatId)) || { seatId };
  const occupied = !!s.occupied;
  const isMine = s.deviceId === deviceId;
  const isPicker = state?.nowPlaying?.requestedBySeat === seatId;
  const free = occupied && !s.deviceId;

  const el = document.createElement(opts.pick && free ? "button" : "div");
  el.className = "seat" + (occupied ? " on" : "") + (isPicker ? " picker" : "")
    + (isMine ? " me" : "") + (opts.pick && free ? " pick" : "");
  if (opts.absolute) {
    const g = SEAT[seatId];
    el.style.cssText =
      `left:${g.x * 100}%;top:${g.y * 100}%;width:${g.w * 100}%;height:${g.h * 100}%`;
  }

  const head = document.createElement("div"); head.className = "head";
  const face = document.createElement("div"); face.className = "face";
  const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = label(seatId);
  const st = document.createElement("div"); st.className = "st";
  st.textContent = !occupied ? "빈 좌석"
    : isMine ? "나"
    : s.nickname ? s.nickname
    : opts.pick ? "선택 가능"
    : seatId === "R1L" ? "음성" : "대기";
  face.append(nm, st);

  el.append(head, face);
  if (opts.pick && free) el.onclick = () => claim(seatId);
  return el;
}

/* ---------- 렌더 ---------- */
function render() {
  if (!state) return;
  const seats = state.seats || [];
  const me = seats.find((s) => s.deviceId === deviceId);
  mySeat = me ? me.seatId : null;

  const driving = state.driveState === "DRIVING";
  const lounge  = state.mode === "CHARGING_LOUNGE";

  status();

  // 분위기
  const ms = $("moodSlot");
  if (state.moodLabel) {
    const c = MOOD_COLOR[state.moodId] || "#6E7B86";
    // 통째로 다시 그리지 않습니다. 같은 요소의 색만 바꿔야 번지듯 넘어갑니다.
    if (!ms.querySelector(".mood"))
      ms.innerHTML = `<div class="mood"><i class="dot"></i><div class="tx"><b></b><span></span></div></div>`;
    const bar = ms.querySelector(".mood");
    // 색면으로 깔아야 '바뀌었다' 가 보입니다. 글자만 바뀌면 아무도 눈치채지 못합니다.
    bar.style.background = c + (darkMode() ? "3d" : "24");
    ms.querySelector(".dot").style.background = c;
    ms.querySelector("b").textContent = state.moodLabel;
    ms.querySelector("span").textContent = state.moodReason || "";
    applyTint(c);
  } else {
    ms.replaceChildren();
    applyTint(null);
  }

  // 좌석 미선택이면 게이트
  if (!mySeat) {
    $("gate").hidden = false; $("main").hidden = true;
    const box = $("carbox");
    if (!box.querySelector("svg")) box.innerHTML = carSvg();
    box.querySelectorAll(".seat").forEach((n) => n.remove());
    Object.keys(SEAT).forEach((id) =>
      box.append(seatNode(id, { absolute:true, pick:true })));
    const free = seats.filter((s) => s.occupied && !s.deviceId).length;
    $("gateHint").textContent = free ? "앉으신 좌석을 눌러주세요" : "착석이 감지된 좌석이 없습니다";
    return;
  }
  $("gate").hidden = true; $("main").hidden = false;

  // 알림 띠
  const st = $("stripSlot"); st.replaceChildren();
  const note = (cls, b, s) =>
    `<div class="note ${cls}"><b>${b}</b><span>${s}</span></div><div class="hr"></div>`;
  let html = "";
  if (lounge) html += note("on", "충전 라운지",
    "정차해 있고 시간이 있습니다. 다음 구간의 플레이리스트를 함께 만드세요");
  if (state.landing) html += note("", "도착 5분 전 — 랜딩 구간",
    "곡이 끊기지 않게 마무리하는 구간입니다");
  if (driving && !state.landing) html += note("", "주행 중에는 선곡 조작이 이 폰에 있습니다",
    "운전자 화면은 잠겨 있고, 운전자는 음성으로만 참여합니다");
  st.innerHTML = html;

  // 좌석 (축약)
  $("seatNote").textContent = (state.seats || []).some((x) => x.occupied)
    ? "앉은 사람은 누구나 바로 넣습니다" : "탑승을 기다리고 있습니다";
  $("cRow1").replaceChildren(...["R1L", "R1R"].map((id) => seatNode(id, {})));
  $("cRow2").replaceChildren(...["R2L", "R2C", "R2R"].map((id) => seatNode(id, {})));
  renderShare();

  // 분위기 추천
  renderSuggestions();

  // 지금 재생
  const np = state.nowPlaying;
  $("npArt").replaceWith(Object.assign(artEl(np && np.artworkUrl, np && np.title), { id:"npArt" }));
  $("npIdle").hidden = !!np;
  for (const k of ["npTitle", "npArtist", "npBy"]) $(k).hidden = !np;
  if (np) {
    $("npTitle").textContent = np.title;
    $("npArtist").textContent = np.artist;
    $("npBy").textContent = `${label(np.requestedBySeat)} 선곡`;
    // 전체 음원이 아니라는 사실을 숨기지 않습니다. 길이도 실제로 흐르는 길이를 씁니다.
    if (np.previewUrl) {
      const b = document.createElement("span");
      b.className = "badge"; b.textContent = `미리듣기 ${Math.round(playMs(np) / 1000)}초`;
      $("npBy").append(b);
    }
    $("npTime").textContent = `${mmss(np.positionMs)} / ${mmss(playMs(np))}`;
    $("npSkip").textContent = `스킵 투표 ${(state.skipVotes || []).length}/${state.skipThreshold || "-"}`;
  } else {
    $("npTime").textContent = ""; $("npSkip").textContent = "";
  }
  $("npBar").style.width = np
    ? Math.min(100, ((np.positionMs || 0) / Math.max(1, playMs(np))) * 100) + "%" : "0";
  $("bSkipIcon").hidden = $("npBarBox").hidden = $("npTimes").hidden = !np;
  $("bLike").disabled = $("bSkip").disabled = !np;
  $("bSkip").textContent = (state.skipVotes || []).includes(mySeat) ? "투표함" : "건너뛰기";

  // 큐
  const q = state.queue || [];
  $("qCount").textContent = q.length;
  $("qLen").textContent = state.queueTargetMs
    ? `${mins(state.queueTotalMs)}분 / 도착 ${mins(state.queueTargetMs)}분` : "";
  const ql = $("queue"); ql.replaceChildren();
  if (!q.length) {
    ql.innerHTML = `<li><span class="empty">앉은 사람이 폰에서 넣으면 여기에 쌓여요</span></li>`;
  } else q.forEach((t, i) => ql.append(trackRow(t, { index:i + 1, by:true })));
  renderPlan();

  $("foot").textContent = `${label(mySeat)} · ${nickname || deviceId}`;
}

/** 목록 한 줄. 차량 QueueRow 와 같은 구성입니다. */
function trackRow(t, o) {
  const li = document.createElement("li");
  if (o.index) {
    const n = document.createElement("span"); n.className = "no"; n.textContent = o.index;
    li.append(n);
  }
  li.append(artEl(t.artworkUrl, t.title));
  const m = document.createElement("div"); m.className = "meta";
  const ti = document.createElement("div"); ti.className = "ti"; ti.textContent = t.title;
  const ar = document.createElement("div"); ar.className = "ar";
  ar.textContent = o.by ? `${t.artist} · ${label(t.requestedBySeat)}`
                        : `${t.artist} · ${mmss(playMs(t))}`;
  m.append(ti, ar); li.append(m);
  if (o.tail) li.append(o.tail(t));
  else { const d = document.createElement("span"); d.className = "dur";
         // 같은 화면에서 길이가 두 값으로 보이면 둘 중 하나는 거짓말입니다.
         // 타임라인과 같은 자, 즉 실제로 흐를 길이로 적습니다.
         d.textContent = mmss(playMs(t)); li.append(d); }
  return li;
}

/**
 * 차가 권하는 곡.
 *
 * 아무도 안 누르면 카운트다운이 끝나는 대로 차가 담습니다. 그래서 '괜찮아요' 가
 * '지금 담기' 만큼 중요한 버튼입니다 — 멈추지 않으면 그냥 들어가니까요.
 * 둘 다 같은 무게로 두고 '괜찮아요' 를 먼저(왼쪽) 둡니다. 어느 쪽도 안전한
 * 기본값이 아니기 때문에 한쪽만 강조하면 거짓말이 됩니다.
 * 자기 차례가 아니어도 누를 수 있습니다. 차가 권한 것을 받아들이는 것뿐이고
 * 선곡권이 한 사람에게 쏠리는 것이 아닙니다.
 */
function renderSuggestions() {
  const slot = $("suggSlot");
  const list = (state && state.suggestions) || [];
  if (!list.length) { slot.replaceChildren(); return; }

  const c = MOOD_COLOR[state.moodId] || "#6E7B86";
  const sec = Math.max(0, Math.ceil((state.suggestAutoAddMs || 0) / 1000));

  const box = document.createElement("section");
  box.className = "sec";
  box.innerHTML = `
    <div class="lbl"><i class="dot" style="width:10px;height:10px;border-radius:50%;flex:none"></i>
      <span class="t"></span><span class="r cd"></span></div>
    <ul></ul>
    <div class="acts">
      <button class="sm" id="bNoThanks">괜찮아요</button>
      <button class="sm" id="bTakeNow">지금 담기</button>
    </div>`;
  box.querySelector(".dot").style.background = c;
  box.querySelector(".t").textContent =
    state.moodLabel ? `${state.moodLabel}에 어울리는 곡` : "추천 곡";
  const cd = box.querySelector(".cd");
  cd.textContent = `${sec}초 뒤 담습니다`;
  cd.style.color = "var(--accent)";

  const ul = box.querySelector("ul");
  list.forEach((t) => ul.append(trackRow(t, {})));

  slot.replaceChildren(box, node(`<div class="hr"></div>`));
  $("bTakeNow").onclick = () => { send({ type:"mood.accept", seatId:mySeat }); toast("담았습니다"); };
  $("bNoThanks").onclick = () => { send({ type:"mood.dismiss", seatId:mySeat }); toast("이번에는 넘어갑니다"); };
}

/**
 * 도착 맞춤 편성.
 *
 * 폰의 플레이리스트는 도착을 모릅니다. 그래서 마지막 곡은 늘 중간에 끊기고,
 * 사람들은 그걸 당연하게 여깁니다. 차는 남은 시간을 알기 때문에 큐와 도착을
 * 같은 자에 올려놓을 수 있습니다 — 도착선이 어느 곡 안에 떨어지는지가 보이면
 * "마지막 곡이 잘린다" 를 말로 설명할 필요가 없습니다.
 *
 * 판정은 차가 합니다(cutIndex·arrivalSlackMs·fitPlan). 폰은 그리기만 합니다.
 */
function renderPlan() {
  const slot = $("planSlot");
  slot.replaceChildren();
  if (!state.fitPlan || state.etaSeconds == null) return;

  const eta = state.etaSeconds * 1000;
  const np = state.nowPlaying;
  const segs = [];
  if (np) segs.push({ ms:Math.max(0, playMs(np) - (np.positionMs || 0)), cls:"now" });
  (state.queue || []).forEach((t, i) =>
    segs.push({ ms:playMs(t), cls:state.cutIndex === i ? "cut" : "q" }));
  if (!segs.length) return;

  const total = segs.reduce((a, x) => a + x.ms, 0);
  // 도착이 큐보다 멀면 도착선이 오른쪽 끝에 와야 하므로 둘 중 큰 값에 맞춥니다.
  const scale = Math.max(total, eta) || 1;

  const box = node(`<div class="plan"><div class="track"></div>
    <div class="foot2"><b></b><span></span></div></div>`);
  const track = box.querySelector(".track");
  segs.forEach((x) => {
    const d = document.createElement("i");
    d.className = "seg " + x.cls;
    d.style.width = (x.ms / scale) * 100 + "%";
    track.append(d);
  });
  const mark = document.createElement("i");
  mark.className = "mark";
  mark.style.left = `calc(${(eta / scale) * 100}% - 1px)`;
  track.append(mark);

  box.querySelector("b").textContent = state.fitPlan;
  box.querySelector("span").textContent =
    state.cutIndex != null ? "도착선이 걸친 곡" : "도착까지 여유";

  // 차가 멋대로 바꾸지 않습니다. 맞출 수 있을 때만 권하고, 누르는 것은 사람입니다.
  if (state.canFitArrival) {
    const b = document.createElement("button");
    b.className = "sm primary"; b.textContent = "도착에 맞추기";
    b.onclick = () => { send({ type:"queue.fit", seatId:mySeat }); toast("도착에 맞춰 순서를 바꿉니다"); };
    box.querySelector(".foot2").append(b);
  }
  slot.append(box);
}

/**
 * 좌석 지분.
 *
 * 차례를 돌리지 않기로 했으니 한 사람이 계속 넣을 수 있습니다. 그래서 규칙으로
 * 막는 대신 보이게만 합니다. 사람은 숫자로 혼나는 것보다 숫자를 보고 스스로
 * 비켜 줍니다. 경고도 제한도 아니고, 사실입니다.
 */
function renderShare() {
  const slot = $("shareSlot");
  slot.replaceChildren();
  const sh = (state.shares || []).filter((x) => x.percent > 0);
  if (!sh.length) return;

  const box = node(`<div class="share"><div class="track"></div>
    <div class="keys"></div></div>`);
  const track = box.querySelector(".track");
  const keys = box.querySelector(".keys");
  sh.forEach((x) => {
    const d = document.createElement("i");
    d.className = "seg";
    d.style.width = x.percent + "%";
    d.style.opacity = SHARE_ALPHA[x.seatId] ?? .2;
    track.append(d);

    const k = document.createElement("span");
    const sw = document.createElement("i");
    sw.style.opacity = SHARE_ALPHA[x.seatId] ?? .2;
    k.append(sw, document.createTextNode(`${label(x.seatId)} ${x.percent}%`));
    keys.append(k);
  });
  if (state.shareNote) {
    const n = document.createElement("div");
    n.className = "note2"; n.textContent = state.shareNote;
    box.append(n);
  }
  slot.append(box);
}

function renderResults(msg) {
  const ul = $("results"); ul.replaceChildren();
  if (!results.length && !msg) { $("srcNote").textContent = ""; return; }   // 담은 뒤 비운 것
  if (!results.length) {
    ul.innerHTML = `<li style="border:0"><span class="empty">결과가 없습니다. 다른 검색어로 해보세요.</span></li>`;
    $("srcNote").textContent = "";
    return;
  }
  results.forEach((t) => {
    ul.append(trackRow(t, { tail: () => {
      const b = document.createElement("button");
      b.className = "sm primary"; b.textContent = "추가";
      b.onclick = () => {
        // 낙관적 업데이트를 하지 않습니다. 다음 state.sync 로만 반영됩니다.
        // 커버 주소를 같이 넘깁니다. 차량 화면이 다시 찾지 않도록 폰이 들고 가는 값입니다.
        // 커버와 음원 주소를 같이 넘깁니다. 차량 화면이 다시 찾지 않도록
        // 폰이 들고 가는 값입니다. previewUrl 이 없으면 소리 없이 시간만 흐릅니다.
        send({ type:"queue.add", seatId:mySeat, title:t.title, artist:t.artist,
               durationMs:t.durationMs, externalId:t.externalId, artworkUrl:t.artworkUrl,
               previewUrl:t.previewUrl, playableMs:t.playableMs });
        // 담았으면 검색은 끝난 것입니다. 결과를 치워 큐가 다시 보이게 합니다.
        results = []; $("q").value = ""; $("q").blur();
        renderResults(null); toast(`담았습니다 — ${t.title}`);
      };
      return b;
    } }));
  });
  $("srcNote").textContent =
    msg && msg.source && msg.source !== "catalog" ? `검색 소스: ${msg.source}` : "";
}

function renderAlbum(a) {
  const el = $("album");
  const who = (a.seats || []).map((s) => s.nickname).filter(Boolean);
  el.innerHTML = `<div class="lbl">드라이브 앨범</div>
    <div style="font-size:17px;font-weight:600;letter-spacing:-.01em"></div>
    <div style="font-size:12.5px;color:var(--sub);margin-top:6px"></div><ul></ul>`;
  el.children[1].textContent = `${mins(a.durationMs)}분 · 함께 들은 ${(a.tracks || []).length}곡`;
  el.children[2].textContent = who.length ? who.join(", ") : "이번 이동의 기록";
  const ul = el.querySelector("ul");
  (a.tracks || []).forEach((t) => ul.append(trackRow(t, { by:true })));
  el.hidden = false;
  el.scrollIntoView({ behavior:"smooth", block:"center" });
}

/* ---------- 이벤트 ---------- */
$("nick").value = nickname;
$("bSkipIcon").append(node(ICON.next));
$("bSearch").onclick = () => {
  const q = $("q").value.trim();
  if (!q) return;
  send({ type:"search.query", q, limit:12 });
};
$("q").addEventListener("keydown", (e) => { if (e.key === "Enter") { $("q").blur(); $("bSearch").click(); } });
$("bLike").onclick = () => { send({ type:"reaction.like", seatId:mySeat }); toast("좋아요를 전달했습니다"); };
const skip = () => send({ type:"vote.skip", seatId:mySeat });
$("bSkip").onclick = skip;
$("bSkipIcon").onclick = skip;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render());

connect();
</script>
</body>
</html>
