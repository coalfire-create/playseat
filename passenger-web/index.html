<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>플레이시트</title>
<style>
  :root{
    --bg:#0e1116; --card:#171c24; --line:#273041; --fg:#e8ecf3; --dim:#8b96a8;
    --accent:#4ea8ff; --warn:#ffb84e; --ok:#49d17f;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:16px;background:var(--bg);color:var(--fg);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
  h1{font-size:17px;margin:0 0 2px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
  .seats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .seat{border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;
        background:#111620;cursor:pointer;font-size:12px}
  .seat.empty{opacity:.35;cursor:not-allowed}
  .seat.mine{border-color:var(--accent);background:#132234}
  .seat.turn{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset}
  .seat b{display:block;font-size:13px;margin-bottom:2px}
  .seat small{color:var(--dim)}
  .np{font-size:16px;font-weight:600}
  .bar{height:3px;background:#243040;border-radius:2px;margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent);width:0}
  button{font:inherit;color:var(--fg);background:#1f2733;border:1px solid var(--line);
         border-radius:9px;padding:9px 13px;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#06121f;font-weight:600}
  button:disabled{opacity:.4;cursor:not-allowed}
  .row{display:flex;gap:8px;align-items:center}
  input{flex:1;font:inherit;color:var(--fg);background:#111620;border:1px solid var(--line);
        border-radius:9px;padding:10px}
  ul{list-style:none;margin:0;padding:0}
  li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  li:last-child{border-bottom:0}
  li small{color:var(--dim)}
  .pill{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .turnbox{background:#2a2112;border-color:#5a4a1e;color:var(--warn);text-align:center;font-weight:600}
  #toast{position:fixed;left:16px;right:16px;bottom:16px;background:#3a1f26;border:1px solid #6b3340;
         color:#ffd9e0;padding:12px;border-radius:10px;display:none}
  .state{font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<h1>플레이시트</h1>
<div class="sub" id="status">연결 중…</div>

<div class="card" id="turnbox" style="display:none"></div>

<div class="card">
  <div class="label">좌석</div>
  <div class="seats" id="seats"></div>
  <div class="state" id="drivestate" style="margin-top:10px"></div>
</div>

<div class="card">
  <div class="label">지금 재생</div>
  <div class="np" id="np">—</div>
  <div class="bar"><i id="pos"></i></div>
  <div class="row" style="margin-top:12px">
    <button id="like">♥ 좋아요</button>
    <button id="skip">스킵 투표 <span id="votes"></span></button>
  </div>
</div>

<div class="card">
  <div class="label">곡 추가</div>
  <div class="row">
    <input id="q" placeholder="곡명 또는 아티스트" autocomplete="off">
    <button id="search">검색</button>
  </div>
  <ul id="results" style="margin-top:10px"></ul>
</div>

<div class="card">
  <div class="label">대기 중인 곡</div>
  <ul id="queue"></ul>
</div>

<div id="toast"></div>

<script>
const SEAT_LABEL = {R1L:"1열 좌 · 운전석", R1R:"1열 우", R2L:"2열 좌", R2C:"2열 중", R2R:"2열 우"};
const params = new URLSearchParams(location.search);
const sessionId = params.get("s") || "a3f9";

let deviceId = localStorage.getItem("playseat.deviceId");
if (!deviceId) {
  deviceId = "dev_" + Math.random().toString(36).slice(2, 8);
  localStorage.setItem("playseat.deviceId", deviceId);
}
let nickname = localStorage.getItem("playseat.nickname") || "";

const $ = (id) => document.getElementById(id);
let ws, state = null, mySeat = null;

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (t.style.display = "none"), 2600);
}

const send = (obj) => ws?.readyState === 1 && ws.send(JSON.stringify({ ts: Date.now(), ...obj }));

function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const host = location.host || "localhost:8080";
  ws = new WebSocket(`${proto}//${host}/session/${sessionId}?role=phone&deviceId=${deviceId}`);

  ws.onopen = () => { $("status").textContent = `세션 ${sessionId} · ${deviceId}`; };
  ws.onclose = () => { $("status").textContent = "연결 끊김 — 재접속 중…"; setTimeout(connect, 2000); };
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === "state.sync") { state = m; render(); }
    else if (m.type === "car.offline") { $("status").textContent = "차량이 연결되지 않았습니다"; }
    else if (m.type === "car.online") { $("status").textContent = `세션 ${sessionId} · ${deviceId}`; }
    else if (m.type === "search.result") { renderResults(m.items || []); }
    else if (m.type === "reject" && (!m.seatId || m.seatId === mySeat)) {
      toast({
        NOT_YOUR_TURN: "지금은 당신의 차례가 아닙니다",
        PROFILE_BLOCKED: "이 좌석에서는 추가할 수 없습니다",
        SEAT_TAKEN: "이미 사용 중인 좌석입니다",
        DUPLICATE_VOTE: "이미 투표했습니다",
        DRIVING_RESTRICTED: "주행 중에는 제한됩니다",
      }[m.reason] || m.reason);
    }
    else if (m.type === "turn.notify" && m.seatId === mySeat) { toast("당신의 차례입니다"); }
  };
}

function claim(seatId) {
  if (!nickname) {
    nickname = (prompt("표시할 이름") || "").trim();
    if (!nickname) return;
    localStorage.setItem("playseat.nickname", nickname);
  }
  send({ type: "seat.claim", deviceId, seatId, nickname });
}

function render() {
  if (!state) return;
  const me = (state.seats || []).find((s) => s.deviceId === deviceId);
  mySeat = me ? me.seatId : null;

  $("seats").innerHTML = "";
  for (const s of state.seats || []) {
    const el = document.createElement("div");
    el.className = "seat" + (!s.occupied ? " empty" : "")
      + (s.deviceId === deviceId ? " mine" : "")
      + (state.turnSeatId === s.seatId ? " turn" : "");
    el.innerHTML = `<b>${SEAT_LABEL[s.seatId] || s.seatId}</b>`
      + `<small>${!s.occupied ? "빈 좌석" : s.nickname ? s.nickname : "참여 대기"}</small>`;
    if (s.occupied && !s.deviceId) el.onclick = () => claim(s.seatId);
    $("seats").appendChild(el);
  }

  const driving = state.driveState === "DRIVING";
  $("drivestate").textContent = driving
    ? "주행 중 — 운전자 화면은 잠겨 있고, 조작 권한은 지금 이 폰에 있습니다"
    : "정차 중 — 운전자 화면에서도 전체 조작이 가능합니다";

  const isMyTurn = mySeat && state.turnSeatId === mySeat;
  const tb = $("turnbox");
  if (isMyTurn) { tb.style.display = "block"; tb.className = "card turnbox"; tb.textContent = "당신의 차례입니다 — 곡을 추가하세요"; }
  else if (state.turnSeatId) { tb.style.display = "block"; tb.className = "card"; tb.innerHTML = `<span class="state">다음 선곡 차례 · ${SEAT_LABEL[state.turnSeatId] || state.turnSeatId}</span>`; }
  else { tb.style.display = "none"; }

  const np = state.nowPlaying;
  $("np").textContent = np ? `${np.title} — ${np.artist}` : "—";
  $("pos").style.width = np ? Math.min(100, (np.positionMs / np.durationMs) * 100) + "%" : "0";
  $("votes").textContent = `(${(state.skipVotes || []).length}/${state.skipThreshold || "-"})`;
  $("like").disabled = $("skip").disabled = !mySeat || !np;

  $("queue").innerHTML = (state.queue || []).length
    ? (state.queue).map((q) =>
        `<li><span>${q.title}<br><small>${q.artist}</small></span>`
        + `<span class="pill">${SEAT_LABEL[q.requestedBySeat] || q.requestedBySeat}</span></li>`).join("")
    : `<li><small>비어 있습니다</small></li>`;
}

function renderResults(items) {
  $("results").innerHTML = items.length
    ? items.map((t, i) =>
        `<li><span>${t.title}<br><small>${t.artist}</small></span>`
        + `<button data-i="${i}">추가</button></li>`).join("")
    : `<li><small>결과가 없습니다</small></li>`;
  renderResults._items = items;
  for (const b of $("results").querySelectorAll("button")) {
    b.onclick = () => {
      if (!mySeat) return toast("먼저 좌석을 선택하세요");
      const t = renderResults._items[+b.dataset.i];
      send({ type: "queue.add", seatId: mySeat, title: t.title, artist: t.artist,
             durationMs: t.durationMs, externalId: t.externalId });
    };
  }
}

$("search").onclick = () => send({ type: "search.query", q: $("q").value, limit: 20 });
$("q").onkeydown = (e) => { if (e.key === "Enter") $("search").click(); };
$("like").onclick = () => send({ type: "reaction.like", seatId: mySeat });
$("skip").onclick = () => send({ type: "vote.skip", seatId: mySeat });

connect();
</script>
</body>
</html>
